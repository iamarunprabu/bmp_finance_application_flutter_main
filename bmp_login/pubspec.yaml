name: bmp_login
description: "Loan Management App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  animate_do: ^3.1.2
  fl_chart: ^0.69.0
  lottie: ^3.3.1

  # State Management
  get: ^4.6.6

  # Network
  http: ^1.2.0
  dio: ^5.4.0

  # Storage & JWT
  shared_preferences: ^2.2.2
  jwt_decoder: ^2.0.1

  # Utilities
  intl: ^0.19.0

  # File Handling (Stable for Mobile)
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  open_file: ^3.3.2
  permission_handler: ^11.3.0
  flutter_riverpod: ^2.5.1
  responsive_builder: ^0.7.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/priority sheet.csv
    - assets/priority sheet.xlsx

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/bmp.png"  # Change this to your icon file name
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/bmp.png"  # Change this too
  min_sdk_android: 21
